name: 'WordPress Deploy'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      php-version:
        description: 'PHP version for linting'
        required: false
        type: string
        default: '8.2'
      config-file:
        description: 'Path to wp-deploy-config.yml'
        required: false
        type: string
        default: 'wp-deploy-config.yml'
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_HOST:
        required: false
      SSH_PORT:
        required: false
      SSH_USER:
        required: false
      WP_CONTENT_PATH:
        required: false
      SLACK_WEBHOOK:
        required: false

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer

      - name: Install PHPCS & WPCS
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-interaction --prefer-dist
          else
            composer init --no-interaction --name="temp/lint"
            composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
            composer require --dev squizlabs/php_codesniffer:"^3.8" wp-coding-standards/wpcs:"^3.0"
          fi

      - name: Run PHPCS
        run: |
          if [ -f "phpcs.xml" ]; then
            ./vendor/bin/phpcs .
          else
            ./vendor/bin/phpcs --standard=WordPress-Core --extensions=php --ignore=vendor .
          fi

  deploy:
    name: 'Deploy'
    needs: [lint]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      slack_channel: ${{ steps.config.outputs.slack_channel }}
      slack_username: ${{ steps.config.outputs.slack_username }}
      slack_icon: ${{ steps.config.outputs.slack_icon }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Parse Configuration
        id: config
        run: |
          CONFIG="${{ inputs.config-file }}"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Config file $CONFIG not found!"
            exit 1
          fi

          TYPE=$(yq '.project.type' "$CONFIG")
          SLUG=$(yq '.project.slug' "$CONFIG")
          DEFAULT_HOST=$(yq '.project.host // "generic"' "$CONFIG")

          # Slack Settings (with defaults)
          SLACK_CHANNEL=$(yq '.slack.channel // "deployments"' "$CONFIG")
          SLACK_USERNAME=$(yq '.slack.username // "DeployBot"' "$CONFIG")
          SLACK_ICON=$(yq '.slack.icon_emoji // ":rocket:"' "$CONFIG")

          # Allow environment variable override for host type
          HOST_TYPE="${{ vars.HOST_TYPE }}"
          if [ -z "$HOST_TYPE" ] || [ "$HOST_TYPE" == "null" ]; then
            HOST_TYPE="$DEFAULT_HOST"
          fi

          # Determine subdirectory based on project type
          case $TYPE in
            theme) SUBDIR="themes" ;;
            plugin) SUBDIR="plugins" ;;
            mu-plugin) SUBDIR="mu-plugins" ;;
            *)
              echo "::warning::Unknown project type '$TYPE', defaulting to themes"
              SUBDIR="themes"
              ;;
          esac

          echo "host_type=$HOST_TYPE" >> $GITHUB_OUTPUT
          echo "subdir=$SUBDIR" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "slack_channel=$SLACK_CHANNEL" >> $GITHUB_OUTPUT
          echo "slack_username=$SLACK_USERNAME" >> $GITHUB_OUTPUT
          echo "slack_icon=$SLACK_ICON" >> $GITHUB_OUTPUT

          # Debug output
          echo "::notice::Deploying $TYPE '$SLUG' to $HOST_TYPE host"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SSH_PORT="${{ vars.SSH_PORT || secrets.SSH_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"
          SSH_HOST="${{ vars.SSH_HOST || secrets.SSH_HOST }}"

          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST is not defined!"
            exit 1
          fi

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo "Validating SSH key..."
          if ! ssh-keygen -l -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "::error::Invalid SSH private key format"
            exit 1
          fi
          echo "::notice::SSH key validated successfully"

      - name: Test SSH Connection
        run: |
          SSH_PORT="${{ vars.SSH_PORT || secrets.SSH_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"
          SSH_USER="${{ vars.SSH_USER || secrets.SSH_USER }}"
          SSH_HOST="${{ vars.SSH_HOST || secrets.SSH_HOST }}"

          if [ -z "$SSH_USER" ]; then
            echo "::error::SSH_USER is not defined!"
            exit 1
          fi

          echo "Testing connection to $SSH_HOST..."
          ssh -o ConnectTimeout=30 -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" "echo 'Connection successful'"

      - name: Deploy via Rsync
        run: |
          # Default excludes
          EXCLUDES=(
            --exclude='.git*'
            --exclude='.github*'
            --exclude='node_modules'
            --exclude='vendor'
            --exclude='wp-deploy-config.yml'
            --exclude='phpcs.xml'
            --exclude='phpcs.xml.dist'
            --exclude='.editorconfig'
            --exclude='.zencoder'
            --exclude='.cursor'
            --exclude='.vscode'
            --exclude='.idea'
            --exclude='composer.json'
            --exclude='composer.lock'
          )

          # Add custom excludes from config
          CONFIG="${{ inputs.config-file }}"
          if [ -f "$CONFIG" ]; then
            while IFS= read -r item; do
              if [ -n "$item" ] && [ "$item" != "null" ]; then
                EXCLUDES+=(--exclude="$item")
              fi
            done < <(yq '.excludes[]' "$CONFIG" 2>/dev/null || true)
          fi

          # Build destination path
          BASE_PATH="${{ vars.WP_CONTENT_PATH || secrets.WP_CONTENT_PATH }}"
          if [ -z "$BASE_PATH" ]; then
            echo "::error::WP_CONTENT_PATH is not defined!"
            exit 1
          fi

          SUBDIR="${{ steps.config.outputs.subdir }}"
          SLUG="${{ steps.config.outputs.slug }}"

          if [[ "$BASE_PATH" == *"wp-content"* ]]; then
            DESTINATION="${BASE_PATH}/${SUBDIR}/${SLUG}/"
          else
            DESTINATION="${BASE_PATH}/wp-content/${SUBDIR}/${SLUG}/"
          fi

          # SSH connection details
          SSH_PORT="${{ vars.SSH_PORT || secrets.SSH_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"
          SSH_USER="${{ vars.SSH_USER || secrets.SSH_USER }}"
          SSH_HOST="${{ vars.SSH_HOST || secrets.SSH_HOST }}"

          echo "::notice::Deploying to ${SSH_HOST}:${DESTINATION}"

          # Deploy with rsync
          rsync -vrlpt --delete --delete-excluded --blocking-io \
            -e "ssh -p ${SSH_PORT}" \
            "${EXCLUDES[@]}" \
            ./ "${SSH_USER}@${SSH_HOST}:${DESTINATION}"

          echo "::notice::Deployment completed successfully"

      - name: Clear Cache
        continue-on-error: true
        run: |
          HOST_TYPE="${{ steps.config.outputs.host_type }}"
          SSH_PORT="${{ vars.SSH_PORT || secrets.SSH_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"
          SSH_USER="${{ vars.SSH_USER || secrets.SSH_USER }}"
          SSH_HOST="${{ vars.SSH_HOST || secrets.SSH_HOST }}"

          SSH_CMD="ssh -o ConnectTimeout=30 -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST}"

          echo "::notice::Clearing cache on $HOST_TYPE host..."

          case $HOST_TYPE in
            kinsta)
              $SSH_CMD "wp kinsta cache purge --all" 2>/dev/null || \
              $SSH_CMD "wp kinsta cache purge" 2>/dev/null || \
              echo "::warning::Kinsta cache clear command not available"
              ;;
            wpengine)
              $SSH_CMD "wp engine cache flush" 2>/dev/null || \
              echo "::warning::WP Engine cache clear command not available"
              ;;
            pressable)
              $SSH_CMD "wp pressable cache purge" 2>/dev/null || \
              echo "::warning::Pressable cache clear command not available"
              ;;
            *)
              $SSH_CMD "wp cache flush" 2>/dev/null || \
              echo "::warning::WP-CLI cache flush not available"
              ;;
          esac

  notify:
    name: 'Notify'
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Slack Notification
        if: ${{ env.SLACK_WEBHOOK != '' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ env.SLACK_WEBHOOK }}
          SLACK_CHANNEL: ${{ needs.deploy.outputs.slack_channel || 'deployments' }}
          SLACK_COLOR: ${{ needs.deploy.result == 'success' && 'good' || 'danger' }}
          SLACK_MESSAGE: |
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Environment:* ${{ inputs.environment }}
            *Status:* ${{ needs.deploy.result == 'success' && '✅ Success' || '❌ Failed' }}
            *Triggered by:* ${{ github.actor }}
          SLACK_TITLE: WordPress Deployment
          SLACK_USERNAME: ${{ needs.deploy.outputs.slack_username || 'DeployBot' }}
          SLACK_ICON_EMOJI: ${{ needs.deploy.outputs.slack_icon || ':rocket:' }}
          SLACK_FOOTER: ''